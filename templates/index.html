<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#e0f7fa,#ffffff);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:420px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .title{
            text-align:center;
            margin-bottom:25px;
        }

        .title h1{
            color:#00796b;
            margin-bottom:8px;
        }

        .title p{
            color:#666;
            font-size:14px;
        }

        .input-box{
            margin-bottom:18px;
        }

        .input-box label{
            display:block;
            margin-bottom:6px;
            color:#333;
            font-weight:bold;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            outline:none;
            transition:0.3s;
        }

        .input-box input:focus{
            border-color:#00796b;
        }

        .btn{
            width:100%;
            padding:14px;
            background:#00796b;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#004d40;
        }

        .result{
            margin-top:25px;
            text-align:center;
            padding:15px;
            border-radius:12px;
            background:#f5f5f5;
        }

        .result h2{
            color:#00796b;
            margin-bottom:10px;
        }

        .accuracy{
            text-align:center;
            margin-top:15px;
            color:#555;
            font-size:14px;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="title">
        <h1>Diabetes Prediction</h1>
        <p>AI-Based Medical Screening System</p>
    </div>

    <form method="POST">

        <div class="input-box">
            <label>Age</label>
            <input type="number" step="0.1" name="age" required>
        </div>

        <div class="input-box">
            <label>BMI</label>
            <input type="number" step="0.1" name="bmi" required>
        </div>

        <div class="input-box">
            <label>HbA1c Level</label>
            <input type="number" step="0.1" name="hba1c" required>
        </div>

        <div class="input-box">
            <label>Blood Glucose Level</label>
            <input type="number" step="0.1" name="glucose" required>
        </div>

        <button class="btn">Check Diabetes</button>

    </form>

    {% if prediction %}

    <div class="result">
        <h2>{{ prediction }}</h2>
        <p>Risk Probability: {{ probability }}</p>
    </div>

    {% endif %}

    <div class="accuracy">
        Model Accuracy: {{ accuracy }}%
    </div>

</div>

</body>
</html>
